name: Build StreamX Media3 Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Detect Project Folder & Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect Output APKs
        run: |
          mkdir -p output-apks
          find . -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-APKs
          path: output-apks/*.apk
